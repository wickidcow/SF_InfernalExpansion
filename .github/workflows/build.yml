name: Build SF Infernal Expansion

on:
  push:
    branches:
      - main
      - 'compat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out addon source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install verified Slimefun Legacy 4.1.81 as a provided build dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.81/Slimefun-Legacy4.1.81.jar" \
            --output ".ci-deps/Slimefun-Legacy4.1.81.jar"
          echo "9d0e436658cb426ecf3468ab55f698fb7e41e23c46e26f9153ffe19a7fa901d1  .ci-deps/Slimefun-Legacy4.1.81.jar" | sha256sum --check
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=.ci-deps/Slimefun-Legacy4.1.81.jar \
            -DgroupId=com.github.wickidcow \
            -DartifactId=Slimefun-Legacy \
            -Dversion=4.1.81 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Compile against Paper 26.3
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Inspect standalone plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/SF_InfernalExpansion1.1.0-beta.1.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -qx "plugin.yml"
          jar tf "$JAR" | grep -qx "ga/kirzu/infernalexpansion/InfernalExpansion.class"
          if jar tf "$JAR" | grep -Eq '^io/github/thebusybiscuit/slimefun4/|^org/bukkit/'; then
            echo "Provided Slimefun/Paper dependencies leaked into the addon JAR" >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -q 'Slimefun'
          echo "Standalone plugin JAR validated."

      - name: Upload raw build JAR for testing
        uses: actions/upload-artifact@v4
        with:
          name: SF_InfernalExpansion-1.1.0-beta.1
          path: target/SF_InfernalExpansion1.1.0-beta.1.jar
          if-no-files-found: error


  paper-runtime-smoke:
    name: Paper 26.3 startup smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download compiled addon
        uses: actions/download-artifact@v4
        with:
          name: SF_InfernalExpansion-1.1.0-beta.1
          path: runtime/plugins

      - name: Download verified Slimefun Legacy release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.81/Slimefun-Legacy4.1.81.jar" \
            --output "runtime/plugins/Slimefun-Legacy4.1.81.jar"
          echo "9d0e436658cb426ecf3468ab55f698fb7e41e23c46e26f9153ffe19a7fa901d1  runtime/plugins/Slimefun-Legacy4.1.81.jar" | sha256sum --check

      - name: Download Paper 26.3 stable server
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds"
          req = Request(url, headers={"User-Agent": "wickidcow-SF_InfernalExpansion-CI/1.0 (GitHub Actions)"})
          with urlopen(req, timeout=60) as resp:
              builds = json.load(resp)
          candidates = [b for b in builds if b.get("channel") == "STABLE"
                        and (b.get("downloads") or {}).get("server:default", {}).get("url")]
          if not candidates:
              raise SystemExit("No downloadable stable Paper 26.3 server found")
          build = max(candidates, key=lambda b: int(b["id"]))
          download = build["downloads"]["server:default"]
          req = Request(download["url"], headers={"User-Agent": "wickidcow-SF_InfernalExpansion-CI/1.0"})
          with urlopen(req, timeout=120) as resp:
              content = resp.read()
          expected = ((download.get("checksums") or {}).get("sha256") or "").lower()
          actual = hashlib.sha256(content).hexdigest()
          if expected and actual != expected:
              raise SystemExit("Paper server download checksum mismatch")
          Path("runtime/paper.jar").write_bytes(content)
          print(f"Paper 26.3 build {build['id']} verified (SHA-256 {actual})")
          PY

      - name: Check both plugins enable on Paper 26.3
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          echo "eula=true" > eula.txt
          cat > server.properties <<'PROPERTIES'
          online-mode=false
          server-ip=127.0.0.1
          server-port=25566
          view-distance=3
          simulation-distance=3
          max-players=1
          spawn-protection=0
          PROPERTIES

          java -Xms512M -Xmx2G -jar paper.jar --nogui > server-console.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!' server-console.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Paper server exited before startup completed"
              tail -n 120 server-console.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Paper startup timed out"
            tail -n 120 server-console.log
            exit 1
          fi

          if ! grep -Fq 'Addon enabled.' server-console.log; then
            echo "Infernal Expansion did not confirm successful enable"
            tail -n 120 server-console.log
            exit 1
          fi
          if grep -Eiq 'Error occurred while enabling (InfernalExpansion|Slimefun)|Could not load.*(InfernalExpansion|Slimefun)|UnknownDependencyException|NoClassDefFoundError' server-console.log; then
            echo "A plugin runtime dependency or enable error was detected"
            tail -n 160 server-console.log
            exit 1
          fi
          echo "PASS: Paper server reached Done and InfernalExpansion logged Addon enabled."
          grep -E 'Slimefun|InfernalExpansion|Done \(' server-console.log | tail -n 50

      - name: Upload Paper server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SF_InfernalExpansion-paper-26.3-startup-log
          path: runtime/server-console.log
          if-no-files-found: warn
