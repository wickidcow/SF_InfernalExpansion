name: Build SF Infernal Expansion

on:
  push:
    branches:
      - main
      - 'compat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out addon source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install verified Slimefun Legacy 4.1.81 as a provided build dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-deps
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.81/Slimefun-Legacy4.1.81.jar" \
            --output ".ci-deps/Slimefun-Legacy4.1.81.jar"
          echo "9d0e436658cb426ecf3468ab55f698fb7e41e23c46e26f9153ffe19a7fa901d1  .ci-deps/Slimefun-Legacy4.1.81.jar" | sha256sum --check
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=.ci-deps/Slimefun-Legacy4.1.81.jar \
            -DgroupId=com.github.wickidcow \
            -DartifactId=Slimefun-Legacy \
            -Dversion=4.1.81 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Compile against Paper 26.3
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Inspect standalone plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/SF_InfernalExpansion1.1.0-SNAPSHOT.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -qx "plugin.yml"
          jar tf "$JAR" | grep -qx "ga/kirzu/infernalexpansion/InfernalExpansion.class"
          if jar tf "$JAR" | grep -Eq '^io/github/thebusybiscuit/slimefun4/|^org/bukkit/'; then
            echo "Provided Slimefun/Paper dependencies leaked into the addon JAR" >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -q 'Slimefun'
          echo "Standalone plugin JAR validated."

      - name: Upload raw build JAR for testing
        uses: actions/upload-artifact@v4
        with:
          name: SF_InfernalExpansion-1.1.0-SNAPSHOT
          path: target/SF_InfernalExpansion1.1.0-SNAPSHOT.jar
          if-no-files-found: error
